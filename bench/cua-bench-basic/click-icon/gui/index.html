<main class="flex flex-col h-full w-full p-6" role="main" aria-label="Icon selection interface">
  <div class="max-w-2xl mx-auto w-full">
    <h1 class="text-xl font-semibold text-gray-900 mb-6">Click the icon</h1>

    <!-- Icon Grid -->
    <div class="grid grid-cols-3 gap-4">
      <!-- Home Icon -->
      <button
        id="icon-Home"
        class="icon-btn flex items-center justify-center p-6 border-2 border-gray-300 rounded-lg hover:border-blue-500 hover:bg-blue-50 transition-colors focus:outline-none focus:ring-2 focus:ring-blue-500"
        aria-label="Home icon"
        data-icon-name="Home"
      >
        <svg class="text-gray-700" style="font-size: 3rem;width:3rem;height:3rem" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M10,20V14H14V20H19V12H22L12,3L2,12H5V20H10Z"/></svg>
      </button>

      <!-- Settings Icon -->
      <button
        id="icon-Settings"
        class="icon-btn flex items-center justify-center p-6 border-2 border-gray-300 rounded-lg hover:border-blue-500 hover:bg-blue-50 transition-colors focus:outline-none focus:ring-2 focus:ring-blue-500"
        aria-label="Settings icon"
        data-icon-name="Settings"
      >
        <svg class="text-gray-700" style="font-size: 3rem;width:3rem;height:3rem" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12,15.5A3.5,3.5 0 0,1 8.5,12A3.5,3.5 0 0,1 12,8.5A3.5,3.5 0 0,1 15.5,12A3.5,3.5 0 0,1 12,15.5M19.43,12.97C19.47,12.65 19.5,12.33 19.5,12C19.5,11.67 19.47,11.34 19.43,11L21.54,9.37C21.73,9.22 21.78,8.95 21.66,8.73L19.66,5.27C19.54,5.05 19.27,4.96 19.05,5.05L16.56,6.05C16.04,5.66 15.5,5.32 14.87,5.07L14.5,2.42C14.46,2.18 14.25,2 14,2H10C9.75,2 9.54,2.18 9.5,2.42L9.13,5.07C8.5,5.32 7.96,5.66 7.44,6.05L4.95,5.05C4.73,4.96 4.46,5.05 4.34,5.27L2.34,8.73C2.21,8.95 2.27,9.22 2.46,9.37L4.57,11C4.53,11.34 4.5,11.67 4.5,12C4.5,12.33 4.53,12.65 4.57,12.97L2.46,14.63C2.27,14.78 2.21,15.05 2.34,15.27L4.34,18.73C4.46,18.95 4.73,19.04 4.95,18.95L7.44,17.95C7.96,18.34 8.5,18.68 9.13,18.93L9.5,21.58C9.54,21.82 9.75,22 10,22H14C14.25,22 14.46,21.82 14.5,21.58L14.87,18.93C15.5,18.67 16.04,18.34 16.56,17.95L19.05,18.95C19.27,19.04 19.54,18.95 19.66,18.73L21.66,15.27C21.78,15.05 21.73,14.78 21.54,14.63L19.43,12.97Z"/></svg>
      </button>

      <!-- Profile Icon -->
      <button
        id="icon-Profile"
        class="icon-btn flex items-center justify-center p-6 border-2 border-gray-300 rounded-lg hover:border-blue-500 hover:bg-blue-50 transition-colors focus:outline-none focus:ring-2 focus:ring-blue-500"
        aria-label="Profile icon"
        data-icon-name="Profile"
      >
        <svg class="text-gray-700" style="font-size: 3rem;width:3rem;height:3rem" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12,4A4,4 0 0,1 16,8A4,4 0 0,1 12,12A4,4 0 0,1 8,8A4,4 0 0,1 12,4M12,14C16.42,14 20,15.79 20,18V20H4V18C4,15.79 7.58,14 12,14Z"/></svg>
      </button>

      <!-- Notifications Icon -->
      <button
        id="icon-Notifications"
        class="icon-btn flex items-center justify-center p-6 border-2 border-gray-300 rounded-lg hover:border-blue-500 hover:bg-blue-50 transition-colors focus:outline-none focus:ring-2 focus:ring-blue-500"
        aria-label="Notifications icon"
        data-icon-name="Notifications"
      >
        <svg class="text-gray-700" style="font-size: 3rem;width:3rem;height:3rem" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M21,19V20H3V19L5,17V11C5,7.9 7.03,5.17 10,4.29C10,4.19 10,4.1 10,4A2,2 0 0,1 12,2A2,2 0 0,1 14,4C14,4.1 14,4.19 14,4.29C16.97,5.17 19,7.9 19,11V17L21,19M14,21A2,2 0 0,1 12,23A2,2 0 0,1 10,21"/></svg>
      </button>

      <!-- Messages Icon -->
      <button
        id="icon-Messages"
        class="icon-btn flex items-center justify-center p-6 border-2 border-gray-300 rounded-lg hover:border-blue-500 hover:bg-blue-50 transition-colors focus:outline-none focus:ring-2 focus:ring-blue-500"
        aria-label="Messages icon"
        data-icon-name="Messages"
      >
        <svg class="text-gray-700" style="font-size: 3rem;width:3rem;height:3rem" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M20,8L4,8L6.4,4.5H17.6M18,9.5L12,21L6,9.5M12,2L1,21H23L12,2Z"/></svg>
      </button>

      <!-- Favorites Icon -->
      <button
        id="icon-Favorites"
        class="icon-btn flex items-center justify-center p-6 border-2 border-gray-300 rounded-lg hover:border-blue-500 hover:bg-blue-50 transition-colors focus:outline-none focus:ring-2 focus:ring-blue-500"
        aria-label="Favorites icon"
        data-icon-name="Favorites"
      >
        <svg class="text-gray-700" style="font-size: 3rem;width:3rem;height:3rem" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12,17.27L18.18,21L16.54,13.97L22,9.24L14.81,8.62L12,2L9.19,8.62L2,9.24L7.45,13.97L5.82,21L12,17.27Z"/></svg>
      </button>
    </div>

    <div class="mt-6 p-3 bg-blue-50 border border-blue-200 rounded">
      <p class="text-sm text-blue-800">
        <svg class="text-blue-600" style="width:1rem;height:1rem" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M13,13H11V7H13M13,17H11V15H13M12,2A10,10 0 0,0 2,12A10,10 0 0,0 12,22A10,10 0 0,0 22,12A10,10 0 0,0 12,2Z"/></svg>
        Click the specified icon to complete the task
      </p>
    </div>

    <!-- Success Message -->
    <div id="success-message" class="hidden mt-4 p-4 bg-green-100 border border-green-400 rounded">
      <div class="flex items-center gap-2">
        <svg class="text-green-600" style="width:1.5rem;height:1.5rem" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12,2A10,10 0 0,1 22,12A10,10 0 0,1 12,22A10,10 0 0,1 2,12A10,10 0 0,1 12,2M11,16.5L18,9.5L16.59,8.09L11,13.67L7.41,10.09L6,11.5L11,16.5Z"/></svg>
        <p class="text-green-800 font-medium">Correct icon clicked!</p>
      </div>
    </div>
  </div>

  <script>
    // Store clicked icon globally for evaluation
    window.__clickedIcon = null;

    // Add click handlers to all icon buttons
    const iconButtons = document.querySelectorAll('.icon-btn');
    iconButtons.forEach((button) => {
      button.addEventListener('click', function () {
        const iconName = this.getAttribute('data-icon-name');
        window.__clickedIcon = iconName;

        // Visual feedback
        iconButtons.forEach((btn) => {
          btn.classList.remove('border-green-500', 'bg-green-50');
          btn.classList.add('border-gray-300');
        });

        this.classList.remove('border-gray-300');
        this.classList.add('border-green-500', 'bg-green-50');

        // Show success message
        document.getElementById('success-message').classList.remove('hidden');
      });
    });
  </script>
</main>

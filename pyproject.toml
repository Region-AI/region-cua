[project]
name = "region-cua"
version = "0.1.0"
description = "本地 Ollama 视觉模型驱动的桌面自动化 Agent"
readme = "README.md"
requires-python = ">=3.11,<4.0"
dependencies = [
    "typer>=0.15",
    "rich>=13",
    "pydantic>=2",
    "pydantic-settings>=2",
    "httpx>=0.27",
    "pillow>=10",
    "pyautogui>=0.9",
    "pyperclip>=1.8",
    "imageio[ffmpeg]>=2.34",
    "numpy>=1.26",
    "mcp>=1.0",
    "uiautomation>=2.0;sys_platform=='win32'",
    # OmniParser 依赖（torch 由 scripts/install_omniparser.py 按 GPU 类型安装）
    "ultralytics>=8.3",
    "easyocr>=1.7",
]

[project.scripts]
region-cua = "region_cua.main:app"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/region_cua"]

[tool.pytest.ini_options]
markers = [
    "integration: 需要 Ollama + 真实桌面环境（默认跳过，用 -m integration 单独运行）",
    "desktop: 需要真实桌面会话",
]
testpaths = ["tests"]
addopts = "-ra"
